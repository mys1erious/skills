<!doctype html>
<html><head><meta charset="utf-8"><title>Earth's water in 1,000 drops</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style></head>
<body><canvas id="out" width="1080" height="1920"></canvas>
<script src="engine.js"></script>
<script>
// Starter: a 12-second explainer in three shots that shows its number with the real data. It shows the mechanics (cues,
// shots and transitions, kinetic type, impact, subtitles, sound), not the pace of a full video: see references/motion.md.
// Data: USGS Water Science School, "Where is Earth's water?" (Gleick 1996): fresh water is 2.5% of all water on Earth,
// ice caps, glaciers and permanent snow 1.74%. So out of 1,000 drops, 25 are fresh and 17 of those are frozen.
const DROPS = 1000, FRESH = 25, ICE = 17;
const COLS = 25, GAP = 26, GX = W / 2 - (COLS - 1) * GAP / 2, GY = 410; // 25 x 40 grid inside the safe area
const BG = ['#06121f', '#0c2340'], SALT = '#2f78c4', DIM = '#173a63', FRESHC = '#8fe6ff', ICEC = '#f4fbff';
const CLUSTER = { x: W / 2, y: 920 }, T = {};
let DROP = [], SHOTS = [];

function init(tl) {
  T.thousand = at('0:thousand'); T.fresh = at('1:twenty'); T.seventeen = at('2:seventeen'); T.frozen = at('2:frozen');
  T.close = T.seventeen - .2; T.title = tl.sentences.at(-1).end + .35;
  const r = rng(3), idx = [...Array(DROPS).keys()];
  for (let i = DROPS - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } // seeded shuffle
  const fresh = new Map(idx.slice(0, FRESH).map((d, k) => [d, k])); // drop -> its slot in the 5 x 5 fresh cluster
  DROP = idx.map((_, i) => {
    const k = fresh.get(i);
    return { x: GX + (i % COLS) * GAP, y: GY + Math.floor(i / COLS) * GAP, land: r() * (T.thousand - .4), k,
      cx: CLUSTER.x + ((k ?? 0) % 5 - 2) * 62, cy: CLUSTER.y + (Math.floor((k ?? 0) / 5) - 2) * 62 };
  }).sort((a, b) => (a.k != null) - (b.k != null)); // fresh drops last, so they draw on top
  SHOTS = [
    { t0: 0, draw: shotGrid, focus: () => CLUSTER, tr: 'in' }, // zooms into the fresh drops...
    { t0: T.close, draw: shotClose, tr: 'whip' },             // ...which fill the next shot, then whip to the end card
    { t0: T.title, draw: shotEnd },
  ];
  const sfx = [], bins = new Set(DROP.map(d => Math.floor(d.land * 12))); // one soft thump per 1/12 s with landings
  for (const b of bins) sfx.push(['thump', b / 12 + .3]);
  sfx.push(['pin', T.thousand], ['whoosh', T.fresh], ['pin', T.fresh + .25], ['dive', T.close], ['impact', T.frozen], ['frost', T.frozen + .1],
    ['whoosh', T.title], ['reveal', T.title + .1]);
  const duration = T.title + 2.6;
  return { duration, title: T.title, music: 'pad', sfx,
    beats: [['hook', .5], ['rain', T.thousand - .4], ['thousand', T.thousand + .4], ['fresh', T.fresh + .7], ['zoom', T.close],
      ['close', T.close + .5], ['frozen', T.frozen + .15], ['frozen+', T.frozen + .8], ['whip', T.title], ['title', T.title + .9], ['end', duration - .1]] };
}

function background() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, BG[0]); g.addColorStop(1, BG[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function dropPath(x, y, r) { // a teardrop, tip up
  ctx.beginPath(); ctx.moveTo(x, y - r * 1.75);
  ctx.bezierCurveTo(x + r * .35, y - r * 1.1, x + r, y - r * .55, x + r, y); ctx.arc(x, y, r, 0, Math.PI);
  ctx.bezierCurveTo(x - r, y - r * .55, x - r * .35, y - r * 1.1, x, y - r * 1.75);
}

// shot 1: every drop of Earth's water rains into a grid; the 25 fresh ones light up and gather
function shotGrid(t) {
  background();
  for (const d of DROP) {
    const p = clamp((t - d.land) / .35); if (p <= 0) continue;
    const isFresh = d.k != null, m = isFresh ? spring(t - T.fresh - d.k * .025, .5, 11) : 0;
    const x = lerp(d.x, d.cx, m), y = lerp(d.y - (1 - easeInCubic(p)) * 420, d.cy, m);
    const sq = .35 * kick(t - d.land - .35, .4, 18), rad = isFresh ? lerp(8, 22, m) : 8;
    ctx.globalAlpha = p;
    if (m > .01) { ctx.fillStyle = BG[0]; ctx.beginPath(); ctx.arc(x, y, rad + 8 * m, 0, TAU); ctx.fill(); } // cut out the grid behind it
    ctx.fillStyle = isFresh && t > T.fresh ? FRESHC : t > T.fresh ? DIM : SALT;
    ctx.beginPath(); ctx.ellipse(x, y, rad * (1 + sq), rad * (1 - sq), 0, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  stamp(t, T.thousand, '1,000', W / 2, 215, 140);
  rise(t, T.thousand + .1, "DROPS: ALL OF EARTH'S WATER", W / 2, 340, 34, { align: 'center', weight: 700, color: '#8fd8e6', sp: 3 });
  stamp(t, T.fresh + .25, '25 FRESH', W / 2, CLUSTER.y - 240, 84, { color: BG[0], box: FRESHC, out: T.close - .15 });
}

// shot 2: the 25 fresh drops up close; 17 freeze, with an impact frame
function shotClose(t) {
  background();
  const s = shake(t, T.frozen, 18); ctx.save(); ctx.translate(s.x, s.y);
  for (let k = 0; k < FRESH; k++) {
    const x = CLUSTER.x + (k % 5 - 2) * 150, y = CLUSTER.y + (Math.floor(k / 5) - 2) * 150 + 40, f = k < ICE ? spring(t - T.frozen - k * .03, .45, 13) : 0;
    if (f > .5) { // frozen: a crystal that spins in
      ctx.save(); ctx.translate(x, y - 20); ctx.rotate(TAU / 8 * f); ctx.scale(f, f); ctx.fillStyle = ICEC; ctx.shadowColor = '#bfefff'; ctx.shadowBlur = 30;
      ctx.fillRect(-46, -46, 92, 92); ctx.restore();
    } else {
      const sc = 1 - f * 2; ctx.fillStyle = FRESHC; ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); dropPath(0, 0, 44); ctx.fill(); ctx.restore();
    }
  }
  ctx.restore();
  rise(t, T.close + .15, '25 FRESH DROPS', W / 2, 330, 56, { align: 'center', color: FRESHC, out: T.frozen - .15 });
  stamp(t, T.frozen, '17', W / 2, 300, 220, { color: ICEC });
  rise(t, T.frozen + .25, 'FROZEN IN ICE CAPS AND GLACIERS', W / 2, 1390, 36, { align: 'center', weight: 700, color: '#8fd8e6', sp: 2 });
  flash(t, T.frozen, .22, '#dff6ff');
}

// shot 3: the takeaway and the source, held to the end
function shotEnd(t) {
  background();
  rise(t, T.title + .1, 'ONLY 2.5%', W / 2, 860, 150, { align: 'center', color: FRESHC });
  rise(t, T.title + .25, "OF EARTH'S WATER", W / 2, 960, 64, { align: 'center' });
  rise(t, T.title + .35, 'IS FRESH', W / 2, 1040, 64, { align: 'center' });
  rise(t, T.title + .7, 'DATA: USGS WATER SCIENCE SCHOOL (GLEICK 1996)', W / 2, 1200, 24, { align: 'center', weight: 500, color: '#8fd8e6', sp: 2 });
}

function draw(t) {
  scenes(t, SHOTS, { ring: FRESHC });
  if (t < T.title) drawSubs(t, 1490); // over the shots, so it never zooms or slides
}

start({ init, draw, fonts: [['Inter Tight', 'fonts/InterTight.ttf', '100 900']] });
</script>
</body></html>
