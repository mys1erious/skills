<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<style>
  /* critical CSS: the loader and the frame are styled before any script arrives */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9b0a2; color: #1c2433; font-family: Georgia, serif; overscroll-behavior: none; }
  canvas#c { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: radial-gradient(ellipse at 50% 44%, #fbf6ea 0%, #efe6d3 58%, #ddd1b9 100%); z-index: 5; transition: opacity .6s; }
  #loader b { display: block; font: italic 500 72px/1 Georgia, serif; }
  #loader span { display: block; margin-top: 12px; font: italic 18px Georgia, serif; color: #5a5448; }
  body.ready #loader { opacity: 0; pointer-events: none; }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; background: #e9e3d6; z-index: 6; padding: 24px; text-align: center; }
  body.nogl #nogl { display: grid; }
</style>
<script type="module" src="/src/main.js"></script>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="{{title}}: an open book. Use the text version below, or the arrow keys to turn pages."></canvas>
<div id="ui"></div>
<main id="a11y" class="sr" aria-label="Text version of the book"></main>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>
<div id="loader" role="status"><div><b>{{title}}</b><span>{{subtitle}} · opening the book</span></div></div>
<div id="nogl" role="alert"><div><h1 style="font:600 24px Georgia,serif;margin:0 0 10px">This book needs WebGL</h1><p style="font:16px/1.5 Georgia,serif;max-width:460px;margin:0 auto">Try a recent Chrome, Edge, Firefox or Safari, or turn on hardware acceleration.</p></div></div>
<noscript><p style="position:fixed;inset:auto 0 0 0;padding:12px;background:#fff;text-align:center">This book needs JavaScript.</p></noscript>
</body>
</html>
